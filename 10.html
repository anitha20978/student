<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>SVG</title>
</head>

<body>

    <h1>SVG Example</h1>

    <svg
        width="600"
        height="400"
        viewBox="0 0 600 400">

        <!-- Rectangle -->

        <rect
            x="50"
            y="50"
            width="200"
            height="100"
            fill="blue">
        </rect>

        <!-- Circle -->

        <circle
            cx="400"
            cy="100"
            r="60"
            fill="green">
        </circle>

        <!-- Line -->

        <line
            x1="50"
            y1="220"
            x2="500"
            y2="220"
            stroke="black"
            stroke-width="5">
        </line>

        <!-- Text -->

        <text
            x="180"
            y="300"
            font-size="30">
            HTML5 SVG
        </text>

    </svg>

</body>
</html>
