<!DOCTYPE html>
<html lang ="en">
    <head>
        <meta charset = "Utf-8">
        <meta name = "viewpoint" content = "width = device-width, initial-scale = 1.0">
        <title>HTML Lists</title>
    </head>
    <style>
        table{
            border-collapse:collapse;
            width: 70%;
        }
        th, td{
            border: 1px solid rgb(239,32,32);
            padding: 10px;
            text-align: center;

        }
        th{
            background-color: rgb(239, 235, 32);
        }
    </style>
    <body>
        <h1>Student Details</h1>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Course</th>
                    <th>Marks</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>101</td>
                    <td>Rahul</td>
                    <td>Java</td>
                    <td>85</td>
                </tr>
                <tr>
                    <td>102</td>
                    <td>Anitha</td>
                    <td>Python</td>
                    <td>90</td>
                </tr>
                <tr>
                    <td>103</td>
                    <td>Arun</td>
                    <td>Web Development</td>
                    <td>78</td>
                </tr>
            </tbody>
            <tfoot>
                <tr>
                    <td colspan="3">Average</td>
                    <td>84.3</td>
                </tr>
            </tfoot>
        </table>
        </body>
</html>
