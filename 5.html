<!DOCTYPE html>
<html lang ="en">
    <head>
        <meta charset = "Utf-8">
        <meta name = "viewpoint" content = "width = device-width, initial-scale = 1.0">
        <title>HTML Lists</title>
    </head>
    <body>
        <h1>HTML Images</h1>
        <img
        src ="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRV0rcihHFtUrcArCN7X6rk7LesyhKIy_AZH2WtCiXX-rpFjxodRWS_yvo&s=10"

        height ="250"

            <img
            src ="https://picsum.photos/300/200"
            alt = "sample image"
            >
            <figcaption>
                sample image displayed using HTML5.
            </figcaption>
        </figure>
        </body>
</html>
